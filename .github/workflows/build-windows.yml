name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean docmask.spec

      - name: Smoke test EXE
        run: |
          if (-not (Test-Path "dist\docmask.exe")) { throw "docmask.exe 未生成" }
          & "dist\docmask.exe" --version

      - name: Smoke test bundled Web UI
        run: |
          $proc = Start-Process -FilePath "dist\docmask.exe" -ArgumentList @("ui", "--no-browser", "--port", "8765") -PassThru
          try {
            $ready = $false
            for ($i = 0; $i -lt 30; $i++) {
              try {
                $health = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/healthz" -TimeoutSec 2
                if ($health.StatusCode -eq 200) { $ready = $true; break }
              } catch {
                Start-Sleep -Milliseconds 500
              }
            }
            if (-not $ready) { throw "Web 服务未在预期时间内启动" }

            $index = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/"
            if ($index.Content -notmatch "把敏感信息，留在本地") { throw "首页静态资源未正确打包" }

            $css = Invoke-WebRequest -UseBasicParsing -Uri "http://127.0.0.1:8765/static/app.css"
            if ($css.StatusCode -ne 200 -or $css.Content.Length -lt 1000) { throw "CSS 静态资源缺失" }

            $payload = @{
              files = @(@{ name = "smoke.txt"; data = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("手机 13800138000")) })
              options = @{ strategy = "replace" }
            } | ConvertTo-Json -Depth 6
            $preview = Invoke-RestMethod -Method Post -Uri "http://127.0.0.1:8765/api/preview" -ContentType "application/json" -Body $payload
            if ($preview.total -lt 1) { throw "预览接口未识别到敏感信息" }
            Write-Host "Web UI smoke test passed"
          } finally {
            Stop-Process -Id $proc.Id -Force -ErrorAction SilentlyContinue
          }

      - name: Package ZIP
        run: |
          New-Item -ItemType Directory -Force dist\package | Out-Null
          Copy-Item dist\docmask.exe dist\package\
          Copy-Item README.md dist\package\
          Copy-Item examples dist\package\examples -Recurse
          Compress-Archive -Force -Path dist\package\* -DestinationPath dist\docmask-windows-x64.zip
          $hash = (Get-FileHash dist\docmask-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  docmask-windows-x64.zip" | Out-File -Encoding ascii dist\SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docmask-windows-x64
          path: |
            dist/docmask-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/docmask-windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
