name: build-windows

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt -r requirements-build.txt

      - name: Run tests
        run: python -m unittest discover -s tests -t .

      - name: Build EXE
        run: python -m PyInstaller --noconfirm --clean docmask.spec

      - name: Smoke test EXE
        run: |
          if (-not (Test-Path "dist\docmask.exe")) { throw "docmask.exe 未生成" }
          & "dist\docmask.exe" --version

      - name: Package ZIP
        run: |
          New-Item -ItemType Directory -Force dist\package | Out-Null
          Copy-Item dist\docmask.exe dist\package\
          Copy-Item README.md dist\package\
          Copy-Item examples dist\package\examples -Recurse
          Compress-Archive -Force -Path dist\package\* -DestinationPath dist\docmask-windows-x64.zip
          $hash = (Get-FileHash dist\docmask-windows-x64.zip -Algorithm SHA256).Hash.ToLower()
          "$hash  docmask-windows-x64.zip" | Out-File -Encoding ascii dist\SHA256SUMS.txt

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: docmask-windows-x64
          path: |
            dist/docmask-windows-x64.zip
            dist/SHA256SUMS.txt

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/docmask-windows-x64.zip
            dist/SHA256SUMS.txt
          generate_release_notes: true
